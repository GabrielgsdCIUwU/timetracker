<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoFlow - Advanced</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 md:p-8 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-900/20 via-slate-900 to-slate-900">
    
    <div class="max-w-3xl mx-auto">
        <header class="text-center mb-10 animate-fade-in-down">
            <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-blue-400 mb-2">ChronoFlow</h1>
            <p class="text-slate-400">Master your time, effortlessly.</p>
        </header>

        <!-- Crear Tarea + Tags -->
        <section class="glass-panel p-6 mb-8">
            <form id="create-task-form" class="flex flex-col md:flex-row gap-3">
                <input type="text" id="task-name" placeholder="What are you working on?" class="flex-1 bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500 transition-colors" required>
                <input type="text" id="task-tags" placeholder="Tags (comma separated)" class="w-full md:w-48 bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500 transition-colors">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 px-6 rounded-lg transition-colors">Create</button>
            </form>
        </section>

        <section id="tasks-container" class="space-y-6"></section>
    </div>

    <!-- Toast and dynamic modal -->
    <div id="toast-container" class="fixed bottom-5 right-5 flex flex-col gap-2 z-50"></div>

    <div id="dynamic-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center z-50 transition-opacity duration-300">
        <div class="bg-slate-800/90 border border-slate-700/50 backdrop-blur-md p-6 rounded-2xl shadow-2xl max-w-sm w-full mx-4 transform transition-all">
            <h3 id="modal-title" class="text-xl font-bold mb-4 text-center text-slate-100"></h3>
            
            <!-- Cuerpo dinámico -->
            <div id="modal-body" class="mb-6 space-y-4"></div> 
            
            <div class="flex justify-end gap-3">
                <button id="modal-btn-cancel" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium transition-colors">
                    Cancel
                </button>
                <button id="modal-btn-confirm" class="px-4 py-2 rounded-lg text-white font-medium transition-colors">
                    Confirm
                </button>
            </div>
        </div>
    </div>

    <!-- Templates -->
    <template id="tpl-modal-confirm">
        <p class="text-slate-300 confirm-message text-center"></p>
    </template>

    <template id="tpl-modal-manual-time">
        <!-- Selector de Modo (Tabs) -->
        <div class="flex bg-slate-900 rounded-lg p-1 mb-5">
            <button type="button" class="tab-btn active flex-1 py-1.5 text-sm font-medium rounded-md bg-slate-700 text-white transition-all" data-target="duration">
                Duration
            </button>
            <button type="button" class="tab-btn flex-1 py-1.5 text-sm font-medium rounded-md text-slate-400 hover:text-white transition-all" data-target="range">
                Date Range
            </button>
        </div>

        <!-- Mode 1: Duration -->
        <div id="mode-duration" class="flex gap-4 text-left animate-fade-in-down">
            <div class="flex-1">
                <label class="block text-sm font-medium text-slate-400 mb-1">Hours</label>
                <input type="number" min="0" value="0" class="manual-hours w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
            <div class="flex-1">
                <label class="block text-sm font-medium text-slate-400 mb-1">Minutes</label>
                <input type="number" min="0" max="59" value="30" class="manual-minutes w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
        </div>

        <!-- Mode 2: Date range -->
        <div id="mode-range" class="hidden flex flex-col gap-4 text-left animate-fade-in-down">
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Start Time</label>
                <input type="datetime-local" class="manual-start w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500 [color-scheme:dark]">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">End Time</label>
                <input type="datetime-local" class="manual-end w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-indigo-500 [color-scheme:dark]">
            </div>
        </div>
    </template>

    <template id="task-template">
        <div class="task-card glass-panel p-5 animate-slide-up">
            <div class="flex flex-col md:flex-row justify-between md:items-center gap-4 mb-4 border-b border-slate-700/50 pb-4">
                <div>
                    <div class="flex items-center gap-3 mb-2">
                        <h2 class="task-title text-xl font-semibold"></h2>
                        <span class="task-status text-xs px-2 py-1 rounded-full uppercase tracking-wider font-bold"></span>
                    </div>
                    <div class="task-tags flex flex-wrap gap-2"></div>
                </div>
                <div class="flex items-center gap-2">
                    <div class="total-time font-mono text-2xl font-bold text-slate-200 mr-2">00:00:00</div>
                    <button class="btn-icon btn-start text-emerald-400" title="Start">▶</button>
                    <button class="btn-icon btn-pause text-amber-400 hidden" title="Pause">⏸</button>
                    <button class="btn-icon btn-stop text-rose-400" title="Complete">⏹</button>
                    <button class="btn-icon btn-reopen text-blue-400 hidden" title="Reopen">↺</button>
                    <button class="btn-icon btn-add-time text-slate-300" title="Add Manual Time">⏱</button>
                    <button class="btn-icon btn-delete text-slate-400 hover:text-rose-400" title="Delete">🗑</button>
                </div>
            </div>
            
            <div class="pl-4 border-l-2 border-slate-700/50">
                <div class="subtasks-list space-y-2 mb-4"></div>
                <form class="create-subtask-form flex gap-2">
                    <input type="text" class="subtask-name flex-1 bg-slate-900/50 border border-slate-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500" placeholder="Add subtask..." required>
                    <button type="submit" class="bg-slate-700 hover:bg-slate-600 px-4 py-1.5 rounded-lg text-sm transition-colors">Add</button>
                </form>
            </div>
        </div>
    </template>

    <template id="subtask-template">
        <div class="flex justify-between items-center bg-slate-800/50 p-3 rounded-lg border border-slate-700/50 hover:border-slate-600 transition-colors">
            <div class="flex items-center gap-3">
                <span class="subtask-title text-sm"></span>
                <span class="subtask-status text-[10px] px-2 py-0.5 rounded-full uppercase font-bold"></span>
            </div>
            <div class="flex items-center gap-2">
                <div class="sub-time font-mono text-sm mr-2 text-slate-300">00:00:00</div>
                <button class="btn-icon btn-start text-emerald-400 w-6 h-6 text-xs">▶</button>
                <button class="btn-icon btn-pause text-amber-400 hidden w-6 h-6 text-xs">⏸</button>
                <button class="btn-icon btn-stop text-rose-400 w-6 h-6 text-xs">⏹</button>
                <button class="btn-icon btn-reopen text-blue-400 hidden w-6 h-6 text-xs">↺</button>
                <button class="btn-icon btn-add-time text-slate-300 w-6 h-6 text-xs" title="Add Manual Time">⏱</button>
                <button class="btn-icon btn-delete text-slate-400 hover:text-rose-400 w-6 h-6 text-xs">🗑</button>
            </div>
        </div>
    </template>

    <script type="module" src="app.js"></script>
</body>
</html>
